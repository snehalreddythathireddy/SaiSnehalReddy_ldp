<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Student</title>
</head>
<body>
<h1>Edit Student</h1>

<form th:action="@{/students/edit/{id}(id=${student.id})}" method="post">
    Name: <input type="text" name="name" th:value="${student.name}"><br>
    Age: <input type="number" name="age" th:value="${student.age}"><br>
    <button type="submit">Update</button>
</form>

<a th:href="@{/students}">Back to list</a>
</body>
</html>
