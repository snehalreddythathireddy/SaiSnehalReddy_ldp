<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant App</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<div class="container">

    <div class="table-sec">
        <h3>Tables</h3>

        <form class="search-form">
            <input
                type="search"
                placeholder="Search here"
                id="tableSearch">
        </form>

        <div id="tablesContainer"></div>
    </div>

    <div class="menu">

        <h4>Menu</h4>

        <form class="search-form">
            <input
                type="search"
                placeholder="Search menu.... by course by food"
                id="menuSearch">
        </form>

        <div id="menuContainer"></div>

    </div>

</div>

<div id="orderModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="modalTitle">Table Order Details</h2>
            <span id="closeModal">&times;</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="orderBody"></tbody>

        </table>

        <div class="modal-footer">

            <h3>Total : ₹<span id="grandTotal">0</span></h3>

            <button id="generateBill">
                Close Session (Generate Bill)
            </button>

        </div>

    </div>

</div>

<script src="./scripts/data.js"></script>
<script src="./scripts/render.js"></script>
<script src="./scripts/app.js"></script>
<script src="./scripts/drag_over.js"></script>
<script src="./scripts/drag_start.js"></script>
<script src="./scripts/generate.js"></script>
<script src="./scripts/show_table.js"></script>
<script src="./scripts/table_search.js"></script>
<script src="./scripts/update_table.js"></script>

</body>
</html>
